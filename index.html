<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#071b2b">
    <title>Monitor de Fornos IoT</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --bg: #071b2b;
            --bg-secondary: #0d2638;
            --card: #102f44;
            --card-light: #163a51;
            --orange: #f47b20;
            --orange-light: #ff963d;
            --blue: #3b82b6;
            --text: #ffffff;
            --text-secondary: #a9bdc9;
            --green: #25c66f;
            --red: #ef5350;
            --yellow: #f5a623;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        button {
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* HEADER */
        .top-header {
            height: 70px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
        }

        /* SCREENS */
        .screen {
            display: none;
            padding: 16px;
            animation: fadeIn 0.25s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SPLASH SCREEN */
        #splashScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(145deg, #071b2b, #0d2638);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .logo-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 4px solid var(--orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            color: var(--orange);
            box-shadow: 0 0 30px rgba(244,123,32,0.2);
        }

        .splash-title {
            font-size: 26px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .splash-title span { color: var(--orange); display: block; }
        .splash-subtitle { margin-top: 12px; color: var(--text-secondary); font-size: 14px; }
        
        .enter-button {
            margin-top: 30px;
            width: 100%;
            height: 50px;
            border-radius: 12px;
            background: var(--orange);
            color: white;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(244,123,32,0.3);
        }

        /* CARDS FORNO */
        .oven-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        .oven-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .oven-name { font-size: 16px; font-weight: 700; }
        .oven-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #697f8d;
        }
        .status-dot.online { background: var(--green); box-shadow: 0 0 8px rgba(37,198,111,0.6); }
        .status-dot.offline { background: var(--red); }

        .oven-main {
            display: grid;
            grid-template-columns: 1fr 100px;
            align-items: center;
            gap: 10px;
        }

        .oven-channels {
            display: flex;
            gap: 15px;
        }

        .oven-temperature {
            font-size: 28px;
            font-weight: 800;
            color: var(--orange);
            line-height: 1;
        }

        .oven-temperature small { font-size: 14px; color: var(--orange-light); }
        .oven-label { color: var(--text-secondary); font-size: 11px; margin-top: 4px; }

        /* DETALHES DO FORNO */
        .oven-detail-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: var(--green);
            margin-bottom: 10px;
        }

        .channels-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .channel-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .detail-temperature {
            font-size: 42px;
            font-weight: 800;
            color: var(--orange);
            line-height: 1;
            margin-top: 6px;
        }

        .detail-label { color: var(--text-secondary); font-size: 11px; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
        }

        .stat-title { color: var(--text-secondary); font-size: 10px; margin-bottom: 4px; text-transform: uppercase; }
        .stat-value { font-size: 14px; font-weight: 700; word-break: break-all; }

        /* TABS */
        .tabs {
            background: var(--bg-secondary);
            padding: 4px;
            border-radius: 12px;
            display: flex;
            margin-bottom: 15px;
        }

        .tab {
            flex: 1;
            padding: 10px 0;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
        }

        .tab.active {
            background: var(--card-light);
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .chart-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
        }

        .chart-wrapper { height: 240px; position: relative; }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 65px;
            background: rgba(7,27,43,0.95);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(10px);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            z-index: 3000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 10px;
        }

        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--orange); }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splashScreen">
        <div class="splash-content">
            <div class="logo-icon">
                <i class="fa-solid fa-fire-flame-curved"></i>
            </div>
            <div class="splash-title">
                <span id="splashEmpresa">Carregando...</span>
            </div>
            <div class="splash-subtitle" id="splashDispositivo">Lendo dados do dispositivo...</div>
            <button class="enter-button" onclick="entrarAplicativo()">Acessar Monitor</button>
        </div>
    </div>

    <!-- APP CONTAINER -->
    <div class="app">

        <!-- HEADER -->
        <header class="top-header">
            <div class="header-left">
                <button id="backButton" class="btn-icon" onclick="voltarLista()" style="display:none;">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div id="pageTitle" class="page-title">Fornos</div>
            </div>
        </header>

        <!-- TELA 1: LISTA DE FORNOS -->
        <main id="screenFornos" class="screen active">
            <div id="listaFornos"></div>
        </main>

        <!-- TELA 2: DETALHES DO FORNO -->
        <main id="screenForno" class="screen">
            <div class="oven-detail-status">
                <span id="detailStatusDot" class="status-dot online"></span>
                <span id="detailStatus">Ativo</span>
            </div>

            <div class="channels-detail-grid">
                <div class="channel-box">
                    <div class="detail-label">Canal 1</div>
                    <div id="detailCanal1" class="detail-temperature">--°C</div>
                </div>
                <div class="channel-box">
                    <div class="detail-label">Canal 2</div>
                    <div id="detailCanal2" class="detail-temperature">--°C</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Módulo Alutal</div>
                    <div id="statModulo" class="stat-value">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Última Leitura</div>
                    <div id="statHora" class="stat-value">--</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active">Histórico de Temperatura</button>
            </div>

            <div id="tabGrafico" class="tab-content active">
                <div class="chart-card">
                    <div class="chart-wrapper">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>
            </div>
        </main>

        <!-- TELA 3: DISPOSITIVO -->
        <main id="screenConfig" class="screen">
            <div class="stat-card" style="margin-bottom: 12px;">
                <div class="stat-title">Empresa</div>
                <div id="infoEmpresa" class="stat-value">--</div>
            </div>
            <div class="stat-card" style="margin-bottom: 12px;">
                <div class="stat-title">Equipamento</div>
                <div id="infoDispositivo" class="stat-value">--</div>
            </div>
            <div class="stat-card" style="margin-bottom: 12px;">
                <div class="stat-title">Número de Série</div>
                <div id="infoSerie" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Firmware</div>
                <div id="infoFirmware" class="stat-value">--</div>
            </div>
        </main>

        <!-- MENU INFERIOR -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="navegar('fornos', this)">
                <i class="fa-solid fa-fire"></i>
                <span>Fornos</span>
            </button>
            <button class="nav-item" onclick="navegar('config', this)">
                <i class="fa-solid fa-microchip"></i>
                <span>Dispositivo</span>
            </button>
        </nav>
    </div>

        function navegar(tela, el) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if(el) el.classList.add('active');

            if(tela === 'fornos') {
                voltarLista();
            } else if(tela === 'config') {
                mostrarTela('screenConfig', 'Dispositivo');
            }
        }

        function mostrarTela(idTela, titulo) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

            atualizarTelaDetalhes();

                            </div>
                            <div>
                                <div class="oven-temperature">${c2}<small>°C</small></div>
                                <div class="oven-label">Canal 2</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right" style="color: var(--text-secondary); text-align: right;"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function atualizarTelaDetalhes() {
            if(!fornoSelecionado) return;
            
            const leituras = db_leituras.filter(l => l.forno_id === fornoSelecionado.id);
            const ultima = leituras[leituras.length - 1];

            if (ultima) {
                document.getElementById('detailCanal1').innerText = `${ultima.canal_1}°C`;
                document.getElementById('detailCanal2').innerText = `${ultima.canal_2}°C`;
                document.getElementById('statModulo').innerText = ultima.modulo_alutal;
                
                const horaFormatada = new Date(ultima.data_hora).toLocaleTimeString('pt-BR');
                document.getElementById('statHora').innerText = horaFormatada;
                document.getElementById('detailStatusDot').className = 'status-dot online';
                document.getElementById('detailStatus').innerText = 'Ativo (Recebendo Dados)';
            } else {
                document.getElementById('detailCanal1').innerText = `--°C`;
                document.getElementById('detailCanal2').innerText = `--°C`;
                document.getElementById('statModulo').innerText = fornoSelecionado.modulo_alutal;
                document.getElementById('statHora').innerText = 'Nenhuma leitura';
                document.getElementById('detailStatusDot').className = 'status-dot offline';
                document.getElementById('detailStatus').innerText = 'Sem Comunicação';
            }

            renderizarGrafico(leituras);
        }

        function renderizarGrafico(leituras) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            
            if(chartInstance) chartInstance.destroy();

            const labels = leituras.map(l => new Date(l.data_hora).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
            const dataCanal1 = leituras.map(l => parseFloat(l.canal_1));
            const dataCanal2 = leituras.map(l => parseFloat(l.canal_2));

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length ? labels : ['Sem dados'],
                    datasets: [
                        {
                            label: 'Canal 1 (°C)',
                            data: dataCanal1.length ? dataCanal1 : [0],
                            borderColor: '#f47b20',
                            backgroundColor: 'rgba(244, 123, 32, 0.1)',
                            tension: 0.2
                        },
                        {
                            label: 'Canal 2 (°C)',
                            data: dataCanal2.length ? dataCanal2 : [0],
                            borderColor: '#3b82b6',
                            backgroundColor: 'rgba(59, 130, 182, 0.1)',
                            tension: 0.2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { 
                            display: true,
                            labels: { color: '#a9bdc9', font: { size: 10 } }
                        } 
                    },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a9bdc9' } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a9bdc9' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
