<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d2638">
    <title>Monitor de Fornos</title>

    <!-- CHART.JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- SUPABASE CLIENT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ÍCONES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --bg: #071b2b;
            --bg-secondary: #0d2638;
            --card: #102f44;
            --card-light: #163a51;
            --orange: #f47b20;
            --orange-light: #ff963d;
            --orange-dark: #d85d0c;
            --blue: #3b82b6;
            --text: #ffffff;
            --text-secondary: #a9bdc9;
            --green: #25c66f;
            --red: #ef5350;
            --yellow: #f5a623;
            --border: rgba(255,255,255,0.07);
            --shadow: 0 10px 30px rgba(0,0,0,0.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
            padding-bottom: 85px;
        }

        button {
            font-family: inherit;
            border: none;
            cursor: pointer;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .top-header {
            height: 72px;
            padding: 18px 18px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-button, .back-button {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--text);
            font-size: 18px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
        }

        .header-action {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--orange);
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(244,123,32,.25);
        }

        .screen {
            display: none;
            padding: 0 16px;
            animation: fadeIn .25s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #splashScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(145deg, #082238, #0d2c42);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .logo-icon {
            width: 125px;
            height: 125px;
            margin: 0 auto 25px;
            border-radius: 50%;
            border: 5px solid var(--orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            color: var(--orange);
        }

        .splash-title {
            font-size: 31px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .splash-title span {
            display: block;
            color: var(--orange);
        }

        .enter-button {
            margin-top: 35px;
            width: 100%;
            height: 52px;
            border-radius: 12px;
            background: var(--orange);
            color: white;
            font-size: 15px;
            font-weight: 700;
        }

        .oven-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 17px;
            margin-bottom: 13px;
            box-shadow: var(--shadow);
        }

        .oven-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 9px;
        }

        .oven-name {
            font-size: 15px;
            font-weight: 700;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            background: #697f8d;
        }

        .status-dot.online {
            background: var(--green);
            box-shadow: 0 0 9px rgba(37,198,111,.7);
        }

        .oven-temperature {
            font-size: 35px;
            font-weight: 800;
            color: var(--orange);
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 30px 10px;
            font-size: 13px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255,255,255,.15);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<!-- SPLASH SCREEN -->
<div id="splashScreen">
    <div class="splash-content">
        <div class="logo-icon">
            <i class="fa-solid fa-fire-flame-curved"></i>
        </div>
        <div class="splash-title">
            Monitor <span>de Fornos</span>
        </div>
        <button class="enter-button" onclick="entrarAplicativo()">Entrar</button>
    </div>
</div>

<!-- APLICATIVO -->
<div class="app">
    <header class="top-header">
        <div class="header-left">
            <button id="backButton" class="back-button" onclick="voltarLista()" style="display:none;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div id="pageTitle" class="page-title">Meus Fornos</div>
        </div>
        <button id="headerAction" class="header-action" onclick="carregarFornos()">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
    </header>

    <main id="screenFornos" class="screen active">
        <div id="listaFornos">
            <div class="loading">
                <div class="spinner"></div>
                Carregando fornos do Supabase...
            </div>
        </div>
    </main>
</div>

<script>
    // Configurações do Supabase (Substitua pelos seus dados)
    const SUPABASE_CONFIG = {
        url: "https://zawnluboujbovpgrgdcx.supabase.co",
        key: "sb_publishable_gJiVQXVjiuSPY3vHt2f8OA_CiES-4Ak",
        tableName: "fornos" // Nome da sua tabela no Supabase
    };

    // Inicializa o cliente do Supabase
    const _supabase = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);

    function entrarAplicativo() {
        document.getElementById('splashScreen').style.display = 'none';
        carregarFornos();
    }

    async function carregarFornos() {
        const container = document.getElementById('listaFornos');
        container.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                Carregando fornos...
            </div>`;

        try {
            // Busca dados no banco de dados do Supabase
            const { data, error } = await _supabase
                .from(SUPABASE_CONFIG.tableName)
                .select('*');

            if (error) throw error;

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="loading">Nenhum forno encontrado.</div>';
                return;
            }

            // Renderiza os cards
            container.innerHTML = data.map(forno => `
                <div class="oven-card">
                    <div class="oven-card-top">
                        <span class="oven-name">${forno.nome || 'Forno Sem Nome'}</span>
                        <div class="oven-status">
                            <span class="status-dot ${forno.status === 'online' ? 'online' : ''}"></span>
                            ${forno.status || 'Offline'}
                        </div>
                    </div>
                    <div class="oven-main">
                        <div class="oven-temperature">
                            ${forno.temperatura ?? '--'} <small>°C</small>
                        </div>
                    </div>
                </div>
            `).join('');

        } catch (err) {
            console.error('Erro ao conectar ao Supabase:', err);
            container.innerHTML = '<div class="loading" style="color: var(--red);">Erro ao carregar os dados. Verifique suas credenciais.</div>';
        }
    }
</script>

</body>
</html>
