<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThermoX - Painel V1</title>
  
  <!-- Supabase JS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #E0E0E0; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .container { width: 100%; max-width: 900px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #2A2A2A; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; color: #FF5722; }
    
    /* Telas */
    .screen { display: none; }
    .active { display: block; }
    
    /* Formulario de Login */
    .card-login { background: #1E1E1E; padding: 30px; border-radius: 12px; border: 1px solid #333; max-width: 400px; margin: 50px auto; }
    .card-login h2 { margin-bottom: 20px; font-size: 1.2rem; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #AAA; }
    .input-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2A2A2A; color: #FFF; }
    button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #FF5722; color: #FFF; font-weight: bold; cursor: pointer; }
    button:hover { background: #E64A19; }
    .btn-logout { width: auto; padding: 6px 12px; font-size: 0.85rem; background: #333; }
    
    /* Grid de Cards */
    .grid-fornos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .card-forno { background: #1E1E1E; border: 1px solid #333; border-radius: 12px; padding: 20px; position: relative; }
    .card-forno h3 { font-size: 1.1rem; color: #CCC; }
    .temp-val { font-size: 2.5rem; font-weight: bold; color: #FF5722; margin: 15px 0 5px 0; }
    .card-footer { font-size: 0.75rem; color: #777; }
    .status-dot { height: 10px; width: 10px; background-color: #4CAF50; border-radius: 50%; display: inline-block; position: absolute; top: 20px; right: 20px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- TELA DE LOGIN -->
    <div id="screen-login" class="screen active">
      <div class="card-login">
        <h2>🔥 ThermoX Login</h2>
        <form id="login-form">
          <div class="input-group">
            <label>E-mail</label>
            <input type="email" id="email" required placeholder="seu@email.com">
          </div>
          <div class="input-group">
            <label>Senha</label>
            <input type="password" id="senha" required placeholder="******">
          </div>
          <button type="submit">Entrar</button>
        </form>
      </div>
    </div>

    <!-- TELA DO DASHBOARD -->
    <div id="screen-dashboard" class="screen">
      <header>
        <h1>🔥 ThermoX - Monitoramento</h1>
        <button class="btn-logout" onclick="logout()">Sair</button>
      </header>

      <div class="grid-fornos" id="grid-fornos">
        <!-- Cards dos fornos inseridos dinamicamente aqui -->
      </div>
    </div>

  </div>

  <script>
    // 1. CHAVES DO SUPABASE (Substitua pelos dados do seu projeto)
    const SUPABASE_URL = "https://zawnluboujbovpgrgdcx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gJiVQXVjiuSPY3vHt2f8OA_CiES-4Ak";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Dicionario de referencia para fornos renderizados
    let listaFornos = {};

    // Elementos da DOM
    const screenLogin = document.getElementById('screen-login');
    const screenDashboard = document.getElementById('screen-dashboard');
    const loginForm = document.getElementById('login-form');
    const gridFornos = document.getElementById('grid-fornos');

    // 2. VERIFICA SE JÁ EXISTE SESSÃO ATIVA
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        exibirDashboard();
      }
    });

    // 3. EVENTO DE LOGIN
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });

      if (error) {
        alert('Erro no login: ' + error.message);
      } else {
        exibirDashboard();
      }
    });

    // 4. LOGOUT
    async function logout() {
      await supabase.auth.signOut();
      screenDashboard.classList.remove('active');
      screenLogin.classList.add('active');
    }

    // 5. CARREGA E RENDERIZA O DASHBOARD
    async function exibirDashboard() {
      screenLogin.classList.remove('active');
      screenDashboard.classList.add('active');

      // Busca os fornos cadastrados
      const { data: fornos, error } = await supabase.from('fornos').select('*');

      if (error) {
        console.error("Erro ao buscar fornos:", error);
        return;
      }

      gridFornos.innerHTML = '';
      
      fornos.forEach(forno => {
        listaFornos[forno.id] = forno;

        const card = document.createElement('div');
        card.className = 'card-forno';
        card.id = `forno-card-${forno.id}`;
        card.innerHTML = `
          <span class="status-dot"></span>
          <h3>${forno.nome}</h3>
          <div class="temp-val" id="temp-forno-${forno.id}">-- °C</div>
          <div class="card-footer" id="time-forno-${forno.id}">Aguardando dados...</div>
        `;
        gridFornos.appendChild(card);
      });

      // Ativa escuta Realtime para novas leituras da API/ESP
      inscreverRealtime();
    }

    // 6. ASSINATURA EM TEMPO REAL (REALTIME)
    function inscreverRealtime() {
      supabase
        .channel('schema-db-changes')
        .on(
          'postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'leituras' },
          (payload) => {
            const leitura = payload.new;
            
            // Atualiza apenas se o forno estiver renderizado na tela
            const elTemp = document.getElementById(`temp-forno-${leitura.forno_id}`);
            const elTime = document.getElementById(`time-forno-${leitura.forno_id}`);

            if (elTemp && elTime) {
              elTemp.innerText = `${leitura.canal_1} °C`;
              
              const horaFormatada = new Date(leitura.data_hora).toLocaleTimeString();
              elTime.innerText = `Atualizado às ${horaFormatada}`;
            }
          }
        )
        .subscribe();
    }
  </script>
</body>
</html>
