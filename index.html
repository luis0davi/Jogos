<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d2638">
    <title>Monitor de Fornos</title>

    <!-- CHART.JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- SUPABASE CLIENT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ÍCONES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --bg: #071b2b;
            --bg-secondary: #0d2638;
            --card: #102f44;
            --card-light: #163a51;
            --orange: #f47b20;
            --orange-light: #ff963d;
            --orange-dark: #d85d0c;
            --blue: #3b82b6;
            --text: #ffffff;
            --text-secondary: #a9bdc9;
            --green: #25c66f;
            --red: #ef5350;
            --yellow: #f5a623;
            --border: rgba(255,255,255,0.07);
            --shadow: 0 10px 30px rgba(0,0,0,0.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
            padding-bottom: 85px;
        }

        button {
            font-family: inherit;
            border: none;
            cursor: pointer;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .top-header {
            height: 72px;
            padding: 18px 18px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
        }

        .header-action {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--orange);
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(244,123,32,.25);
        }

        .screen {
            display: none;
            padding: 0 16px;
            animation: fadeIn .25s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #splashScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(145deg, #082238, #0d2c42);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .logo-icon {
            width: 125px;
            height: 125px;
            margin: 0 auto 25px;
            border-radius: 50%;
            border: 5px solid var(--orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            color: var(--orange);
        }

        .splash-title {
            font-size: 31px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .splash-title span {
            display: block;
            color: var(--orange);
        }

        .enter-button {
            margin-top: 35px;
            width: 100%;
            height: 52px;
            border-radius: 12px;
            background: var(--orange);
            color: white;
            font-size: 15px;
            font-weight: 700;
        }

        .oven-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 17px;
            margin-bottom: 13px;
            box-shadow: var(--shadow);
        }

        .oven-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .oven-name {
            font-size: 16px;
            font-weight: 700;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: #697f8d;
            margin-right: 4px;
        }

        .status-dot.online {
            background: var(--green);
            box-shadow: 0 0 9px rgba(37,198,111,.7);
        }

        .oven-channels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: var(--bg-secondary);
            padding: 10px;
            border-radius: 12px;
        }

        .channel-box {
            text-align: center;
        }

        .channel-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .oven-temperature {
            font-size: 26px;
            font-weight: 800;
            color: var(--orange);
        }

        .oven-footer {
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 30px 10px;
            font-size: 13px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255,255,255,.15);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<!-- SPLASH SCREEN -->
<div id="splashScreen">
    <div class="splash-content">
        <div class="logo-icon">
            <i class="fa-solid fa-fire-flame-curved"></i>
        </div>
        <div class="splash-title">
            Monitor <span>de Fornos</span>
        </div>
        <button class="enter-button" onclick="entrarAplicativo()">Entrar</button>
    </div>
</div>

<!-- APLICATIVO -->
<div class="app">
    <header class="top-header">
        <div class="header-left">
            <div id="pageTitle" class="page-title">Meus Fornos</div>
        </div>
        <button id="headerAction" class="header-action" onclick="carregarFornos()">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
    </header>

    <main id="screenFornos" class="screen active">
        <div id="listaFornos">
            <div class="loading">
                <div class="spinner"></div>
                Carregando fornos...
            </div>
        </div>
    </main>
</div>

<script>
    // Configurações do Supabase
    const SUPABASE_CONFIG = {
        url: "https://zawnluboujbovpgrgdcx.supabase.co",
        key: "sb_publishable_gJiVQXVjiuSPY3vHt2f8OA_CiES-4Ak"
    };

    // Inicializa o cliente do Supabase
    const _supabase = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);

    function entrarAplicativo() {
        document.getElementById('splashScreen').style.display = 'none';
        carregarFornos();
    }

    async function carregarFornos() {
        const container = document.getElementById('listaFornos');
        container.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                Atualizando dados...
            </div>`;

        try {
            // 1. Busca os fornos ativos
            const { data: fornos, error: errFornos } = await _supabase
                .from('fornos')
                .select('*')
                .eq('ativo', true)
                .order('numero', { ascending: true });

            if (errFornos) throw errFornos;

            if (!fornos || fornos.length === 0) {
                container.innerHTML = '<div class="loading">Nenhum forno ativo cadastrado.</div>';
                return;
            }

            // Renderiza os fornos e busca a última leitura de cada um
            let htmlContent = '';

            for (const forno of fornos) {
                // Busca a leitura mais recente deste forno específico
                const { data: leituras } = await _supabase
                    .from('leituras')
                    .select('canal_1, canal_2, data_hora')
                    .eq('forno_id', forno.id)
                    .order('data_hora', { ascending: false })
                    .limit(1);

                const ultimaLeitura = leituras && leituras.length > 0 ? leituras[0] : null;

                const temp1 = ultimaLeitura?.canal_1 != null ? Number(ultimaLeitura.canal_1).toFixed(1) : '--';
                const temp2 = ultimaLeitura?.canal_2 != null ? Number(ultimaLeitura.canal_2).toFixed(1) : '--';
                
                // Formatação da última data/hora
                let horaFormatada = 'Sem registros';
                if (ultimaLeitura?.data_hora) {
                    const dataObj = new Date(ultimaLeitura.data_hora);
                    horaFormatada = dataObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                }

                htmlContent += `
                    <div class="oven-card">
                        <div class="oven-card-top">
                            <span class="oven-name">${forno.nome || `Forno ${forno.numero}`}</span>
                            <div style="font-size: 12px; color: var(--text-secondary);">
                                Módulo: ${forno.modulo_alutal}
                            </div>
                        </div>

                        <div class="oven-channels">
                            <div class="channel-box">
                                <div class="channel-label">Canal 1</div>
                                <div class="oven-temperature">${temp1}<small style="font-size: 14px;"> °C</small></div>
                            </div>
                            <div class="channel-box">
                                <div class="channel-label">Canal 2</div>
                                <div class="oven-temperature">${temp2}<small style="font-size: 14px;"> °C</small></div>
                            </div>
                        </div>

                        <div class="oven-footer">
                            <span>Última atualização:</span>
                            <span>${horaFormatada}</span>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = htmlContent;

        } catch (err) {
            console.error('Erro ao conectar ao Supabase:', err);
            container.innerHTML = '<div class="loading" style="color: var(--red);">Erro ao carregar dados do Supabase. Verifique suas chaves de API.</div>';
        }
    }
</script>

</body>
</html>
